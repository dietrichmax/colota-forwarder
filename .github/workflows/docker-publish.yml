name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package*.json"
      - "tsconfig.json"
      - "webpack.config.js"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  push_to_registry:
    name: Push image to Docker Hub
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build image for smoke test
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          provenance: false
          tags: colota-forwarder:smoke

      - name: Smoke test image
        run: |
          docker run --detach --name smoke --publish 3000:3000 colota-forwarder:smoke
          if curl --fail --silent --retry 10 --retry-delay 1 --retry-all-errors http://localhost:3000/health; then
            echo "Health check passed"
          else
            echo "Health check failed"
            docker logs smoke
            exit 1
          fi
          docker rm --force smoke

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push (main branch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/colota-forwarder:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/colota-forwarder:latest

      - name: Build and push (release published)
        if: github.event_name == 'release'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/colota-forwarder:${{ github.ref_name }}
