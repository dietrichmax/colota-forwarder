services:
  colota-forwarder:
    image: mxdcodes/colota-forwarder:v0.4.6@sha256:76c8786435c6a7e1dbce0e8390f295099aa0ec826bc51b59e836806d97f19cd0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.5"
