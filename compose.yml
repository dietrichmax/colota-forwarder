services:
  colota-forwarder:
    image: mxdcodes/colota-forwarder:v0.4.9@sha256:cd9ff153d0a4e2dfffdfc55ba29f5dad49b96bdec848132b87ce5c6750deef63
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.5"
