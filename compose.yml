services:
  colota-forwarder:
    image: mxdcodes/colota-forwarder:v0.4.7@sha256:4c98ec01e4c3615d115a953c53134d20a96115feae27f3d874a982488689db29
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.5"
