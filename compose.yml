services:
  colota-forwarder:
    image: mxdcodes/colota-forwarder:v0.4.8@sha256:293fa170e37551a508f36d3c21c24e93505c053bf3f8c8c9ef7f495719beb3a6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.5"
